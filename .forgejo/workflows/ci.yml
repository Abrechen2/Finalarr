name: CI (Forgejo)

# Homelab Forgejo runner, label `homelab-docker` (default job image
# node:22-bookworm). No path filters, no continue-on-error.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, security, tests)
    runs-on: homelab-docker
    container: python:3.12-bookworm
    defaults:
      run:
        working-directory: backend
    steps:
      # actions/checkout is a node action; the Python image has no node.
      - name: Install node for actions
        working-directory: /
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install
        run: pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -e '.[dev]'
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy
      - name: Bandit
        run: bandit -q -r finalarr
      - name: pip-audit
        run: pip-audit --skip-editable
      - name: Pytest
        run: pytest --cov --cov-fail-under=80

  frontend:
    name: Frontend (types, lint, format, tests)
    runs-on: homelab-docker
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Vitest
        run: npm run coverage
