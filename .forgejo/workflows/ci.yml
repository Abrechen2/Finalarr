name: CI (Forgejo)

# Homelab Forgejo runner, label `homelab-docker` (default job image
# node:22-bookworm). No path filters, no continue-on-error.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, security, tests)
    runs-on: homelab-docker
    container: python:3.12-bookworm
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install
        run: pip install --no-cache-dir --upgrade pip && pip install --no-cache-dir -e '.[dev]'
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy
      - name: Bandit
        run: bandit -q -r finalarr
      - name: pip-audit
        run: pip-audit --skip-editable
      - name: Pytest
        run: pytest --cov --cov-fail-under=80

  frontend:
    name: Frontend (types, lint, format, tests)
    runs-on: homelab-docker
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Vitest
        run: npm run coverage

  image:
    name: Docker image (amd64, no push)
    runs-on: homelab-docker
    needs: [backend, frontend]
    # Needs the host Docker socket: never for pull_request runs.
    if: github.event_name != 'pull_request'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - name: Build
        run: docker build --platform linux/amd64 --build-arg VERSION="$(cat backend/VERSION)-ci" -t finalarr:ci .
