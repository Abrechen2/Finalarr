name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, security, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Install
        # The locked versions the image ships, then the dev tools.
        run: pip install --upgrade pip && pip install --require-hashes -r requirements.txt && pip install -e '.[dev]' && pip check
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Mypy
        run: mypy
      - name: Bandit
        run: bandit -q -r finalarr
      - name: pip-audit
        run: pip-audit --skip-editable
      - name: Pytest
        run: pytest --cov --cov-fail-under=80

  frontend:
    name: Frontend (types, lint, format, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run build

  e2e:
    name: E2E (onboarding to a delivered report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install -q --require-hashes -r backend/requirements.txt
          backend/.venv/bin/pip install -q --no-deps ./backend
          (cd frontend && npm ci --no-audit --no-fund)
          (cd e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)
      - run: e2e/run.sh
