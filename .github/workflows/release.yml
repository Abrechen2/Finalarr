name: Release

# vX.Y.Z-rc.N → amd64 image (X.Y.Z-rc.N, rc-latest), GitHub pre-release.
# vX.Y.Z      → only arm64 is built, from the commit of the tested release candidate;
#               it is joined with that candidate's amd64 image (same bytes) into
#               X.Y.Z, X.Y and latest, GitHub release. Tag the final on the commit of
#               the candidate that was tested.
# Nothing is published unless CI passes on the tagged commit and the image starts and
# answers /health. Images carry an SBOM and provenance and are signed (cosign, keyless).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # tags, to find the tested release candidate
      - name: Version
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="${REGISTRY}/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          test "$(cut -d- -f1 <<<"$version")" = "$(cat backend/VERSION)" \
            || { echo "tag $version does not match backend/VERSION"; exit 1; }
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            rc="$(git tag --points-at HEAD --list "v${version}-rc.*" | sort -V | tail -1)"
            test -n "$rc" || { echo "no tested release candidate on this commit"; exit 1; }
            {
              echo "prerelease=false"
              echo "rc=${rc#v}"
              echo "minor=$(cut -d. -f1,2 <<<"$version")"
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.v.outputs.prerelease == 'false'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image for the start test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ steps.v.outputs.prerelease == 'true' && 'linux/amd64' || 'linux/arm64' }}
          load: true
          tags: finalarr:smoke
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
      - name: Start test (answers /health)
        run: |
          docker run -d --name smoke -p 5790:5790 \
            -e FINALARR_API_KEY="$(openssl rand -hex 32)" \
            -e FINALARR_SECRET_KEY="$(openssl rand -base64 32 | tr '+/' '-_')" finalarr:smoke
          # arm64 runs under emulation for the final and needs longer to start.
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5790/health; then docker rm -f smoke; exit 0; fi
            sleep 2
          done
          docker logs smoke; exit 1

      # Release candidate: build and push amd64.
      - id: meta
        if: steps.v.outputs.prerelease == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=rc-latest
      - id: build
        if: steps.v.outputs.prerelease == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # Final: arm64 from this commit, joined with the tested amd64 candidate.
      - id: arm
        if: steps.v.outputs.prerelease == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}-arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Join the tested amd64 image and arm64
        id: final
        if: steps.v.outputs.prerelease == 'false'
        env:
          IMAGE: ${{ steps.v.outputs.image }}
          VERSION: ${{ steps.v.outputs.version }}
          RC: ${{ steps.v.outputs.rc }}
          MINOR: ${{ steps.v.outputs.minor }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" -t "$IMAGE:$MINOR" -t "$IMAGE:latest" \
            "$IMAGE:$RC" "$IMAGE:$VERSION-arm64"
          echo "digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.final.outputs.digest }}
        run: cosign sign --yes "${{ steps.v.outputs.image }}@${DIGEST}"
      - name: Release notes from CHANGELOG
        run: |
          version="$(cat backend/VERSION)"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.v.outputs.prerelease }}" = true ]; then
            gh release create "$GITHUB_REF_NAME" --prerelease --notes-file notes.md --title "Finalarr $GITHUB_REF_NAME" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --latest --notes-file notes.md --title "Finalarr $GITHUB_REF_NAME" --verify-tag
          fi
