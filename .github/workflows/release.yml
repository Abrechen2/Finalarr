name: Release

# vX.Y.Z-rc.N → amd64 image, GitHub pre-release.
# vX.Y.Z      → amd64 + arm64 image tagged X.Y.Z, X.Y and latest, GitHub release.
# Nothing is published unless CI passes on the tagged commit and the image starts
# and answers /health. Images carry an SBOM and provenance and are signed (cosign,
# keyless).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write  # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Version
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          fi
          test "$(cut -d- -f1 <<<"$version")" = "$(cat backend/VERSION)" \
            || { echo "tag $version does not match backend/VERSION"; exit 1; }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: steps.v.outputs.prerelease == 'false'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test (amd64 image starts and answers /health)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: finalarr:smoke
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
      - name: Run smoke test
        run: |
          docker run -d --name smoke -p 5790:5790 \
            -e FINALARR_API_KEY="$(openssl rand -hex 32)" \
            -e FINALARR_SECRET_KEY="$(openssl rand -base64 32 | tr '+/' '-_')" finalarr:smoke
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5790/health; then docker rm -f smoke; exit 0; fi
            sleep 2
          done
          docker logs smoke; exit 1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.v.outputs.prerelease == 'false' }}
            type=raw,value=rc-latest,enable=${{ steps.v.outputs.prerelease == 'true' }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ steps.v.outputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image
        run: cosign sign --yes "${{ steps.v.outputs.image }}@${{ steps.build.outputs.digest }}"
      - name: Release notes from CHANGELOG
        run: |
          version="$(cat backend/VERSION)"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.v.outputs.prerelease }}" = true ]; then
            gh release create "$GITHUB_REF_NAME" --prerelease --notes-file notes.md --title "Finalarr $GITHUB_REF_NAME" --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --latest --notes-file notes.md --title "Finalarr $GITHUB_REF_NAME" --verify-tag
          fi
