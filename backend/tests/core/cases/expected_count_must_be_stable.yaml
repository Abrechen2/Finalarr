# Sonarr adds episodes in the same window the files arrive: wait one more reconcile.
season: {number: 1}
episodes: {count: 2, first_air: 2026-01-05, interval_days: 7}
runs:
  - {now: 2026-01-01, files: "", expect: {state: scheduled, events: []}}
  - {now: 2026-02-01, count: 3, files: "1-3", expect: {state: aired, events: [{type: episodes_available, episodes: "1-3"}]}}
  - {now: 2026-02-01T00:30, count: 3, files: "1-3", expect: {state: complete, events: [{type: season_complete, have: 3, expected: 3}]}}
