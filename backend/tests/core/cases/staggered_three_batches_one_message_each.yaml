# A Netflix-style staggered release: three batches, one message per batch.
season: {number: 2}
episodes: {count: 9, first_air: 2026-03-01, interval_days: 0}
runs:
  - {now: 2026-02-01, files: "", expect: {state: scheduled, events: []}}
  - {now: 2026-03-02, files: "1-3", expect: {state: aired, events: [{type: episodes_available, episodes: "1-3"}]}}
  - {now: 2026-03-02T01:00, files: "1-3", expect: {state: aired, events: []}}
  - {now: 2026-03-09, files: "1-6", expect: {state: aired, events: [{type: episodes_available, episodes: "4-6"}]}}
  - {now: 2026-03-16, files: "1-9", expect: {state: complete, events: [{type: season_complete, have: 9, expected: 9}]}}
