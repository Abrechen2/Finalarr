# Weekly show; the finale (finaleType=season) and completeness land in one run → one message.
season: {number: 3}
episodes: {count: 4, first_air: 2026-01-05, interval_days: 7, finale: {4: season}}
runs:
  - {now: 2026-01-01, files: "", expect: {state: scheduled, events: []}}
  - {now: 2026-01-06, files: "1", expect: {state: airing, events: [{type: episodes_available, episodes: "1"}]}}
  - {now: 2026-01-20, files: "1-3", expect: {state: airing, events: [{type: episodes_available, episodes: "2-3"}]}}
  - {now: 2026-01-27, files: "1-4", expect: {state: complete, events: [{type: season_complete, have: 4, expected: 4, finale: 4}]}}
